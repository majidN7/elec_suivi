services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elec_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elec_app_dev_pw}
      POSTGRES_DB: elec_suivi
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elec_app -d elec_suivi"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elec_app:${POSTGRES_PASSWORD:-elec_app_dev_pw}@db:5432/elec_suivi?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in your .env file (openssl rand -base64 32)}
      # Auth.js builds every absolute URL it emits (post-login redirect,
      # post-logout redirect, the callback-url cookie) from this value
      # verbatim — it does NOT look at the incoming request's Host header.
      # A silent "localhost" fallback here previously caused sign-in/out to
      # send every visitor's browser to their OWN machine instead of back to
      # this server, which looks like "the buttons do nothing". Required on
      # purpose so a forgotten override fails loudly instead of silently.
      # Set it in your .env to the URL users actually type in their browser
      # (http://<server-ip>:3000 or your domain). See .env.example.
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in your .env file to this server's real public URL, e.g. http://<server-ip>:3000 — see .env.example}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@elec-suivi.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
