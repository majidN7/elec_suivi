# Automatically merged by `docker compose up` (no -f flags) to turn the
# `app` service into a hot-reloading development container: the local
# source is bind-mounted in and Next.js runs via `next dev`.
#
# This file is ignored as soon as you pass an explicit -f list, e.g. for a
# production-style run:
#   docker compose -f docker-compose.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/src/generated
      # Keep the image's own LF-normalized copy: a Windows checkout of this
      # bind-mounted file can carry CRLF line endings, which breaks its
      # #!/bin/sh shebang ("no such file or directory").
      - /app/docker-entrypoint.sh
